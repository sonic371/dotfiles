# Your main font for all text
# font_family      Px437 DOS/V re. JPN12

# Initial window size
remember_window_size no
initial_window_width  150c
initial_window_height 50c

# BEGIN_KITTY_FONTS
font_family      family="Px437 DOS/V re. JPN24"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Appearence
background_opacity 0.8

# Terminal charts (alpaca-dev main.py --moomoo): kitty draws the box, block
# and braille characters itself, so candles and lines join without gaps.
# Keep price/time columns as plain characters, and don't add line spacing
# (modify_font cell_height would open gaps between candle rows).
disable_ligatures always
