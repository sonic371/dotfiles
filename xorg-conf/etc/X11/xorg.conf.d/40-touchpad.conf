Section "InputClass"
    Identifier "Touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Tap-to-click
    Option "Tapping" "on"
    # Natural scrolling
    Option "NaturalScrolling" "on"
    # Middle button via two-finger or three-finger tap
    Option "MiddleEmulation" "on"
    # Cursor acceleration
    Option "AccelSpeed" "0.2"
    # Smooth scroll distance
    Option "ScrollPixelDistance" "20"
EndSection

# External trackpads that X sees as mice, so the touchpad class above misses them
Section "InputClass"
    Identifier "External trackpads"
    MatchProduct "Function Trackpad Mouse|HUKE T3 Pro Mouse"
    Driver "libinput"
    Option "NaturalScrolling" "on"
EndSection

# Apple Magic Trackpad 2 over USB
Section "InputClass"
    Identifier "Magic Trackpad USB"
    MatchUSBID "05ac:0265"
    Driver "libinput"
    Option "Tapping" "on"
EndSection

Section "InputClass"
    Identifier "TrackPoint"
    MatchProduct "TPPS/2 Synaptics TrackPoint"
    Driver "libinput"

    # TrackPoint scroll distance
    Option "ScrollPixelDistance" "30"
    # Slow down cursor movement
    Option "AccelSpeed" "-0.5"
EndSection
